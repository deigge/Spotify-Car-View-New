services:
  backend:
    container_name: spotify-app-backend-dev
    build: ../backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    env_file:
      - ../backend/.env
    depends_on:
      - mongo
    volumes:
      - ../backend:/app
      - /app/node_modules
      - ../certs/lyra:/var/www/certs/lyra:ro
    networks:
      - app-net

  frontend:
    container_name: spotify-app-frontend-dev
    build: ../frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    networks:
      - app-net

  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - app-net

  cloudflared:
    container_name: spotify-app-tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
      - backend
    networks:
      - app-net

networks:
  app-net:

volumes:
  mongo-data:
